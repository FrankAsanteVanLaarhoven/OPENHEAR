[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openhear-bridge"
version = "0.5.0"
description = "Offline-audited Mandarin-English research translator with turn-based continuous captions and offline pilot readiness"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "soundfile>=0.12"]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=5.0,<6.0", "sentencepiece>=0.2", "scipy>=1.12,<2", "huggingface-hub>=1,<3"]
web = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "python-multipart>=0.0.9"]
test = ["pytest>=8", "httpx>=0.27"]
bench = ["sacrebleu>=2.4,<3"]
all = ["torch>=2.2", "transformers>=5.0,<6.0", "sentencepiece>=0.2", "scipy>=1.12,<2", "huggingface-hub>=1,<3", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "python-multipart>=0.0.9", "sacrebleu>=2.4,<3"]

[project.scripts]
openhear = "openhear.cli:main"

[tool.setuptools.packages.find]
include = ["openhear*"]

[tool.setuptools.package-data]
openhear = ["static/*.html", "static/*.js", "static/*.css"]
